<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGS Panel Lookup</title>
<style>
  :root{
    --card-bg:#ffffff;
    --text:#20223f;
    --dim:#6d6f92;
    --line:#dcdcee;
    --bg:#f4f4fb;
    --g1:#e7e2fb; --g2:#dfeafb;
    --a1:#7a5fd6; --a2:#2f7fd4; --a3:#b04fc0; --a4:#c2841f;
    --focus:47,127,212;
    --hot:#7a5fd6;
  }
  body.heme{
    --text:#3a1d24;
    --dim:#8d6470;
    --line:#eeccd4;
    --bg:#fdf3f5;
    --g1:#fbe0e6; --g2:#f7dfd6;
    --a1:#c0345a; --a2:#a8434f; --a3:#d4626f; --a4:#b0553a;
    --focus:192,52,90;
    --hot:#c0345a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(820px 460px at 10% -10%, var(--g1) 0%, transparent 60%),
      radial-gradient(680px 400px at 95% 2%, var(--g2) 0%, transparent 58%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    line-height:1.5;
    padding:34px 20px 70px;
    min-height:100vh;
    transition:background-color .25s;
  }
  .wrap{max-width:740px;margin:0 auto}
  header{margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  h1{font-size:1.5rem;font-weight:600;margin:0 0 5px;letter-spacing:-.01em}
  .sub{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);margin:0;
  }
  .toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card-bg);flex-shrink:0}
  .toggle button{
    font-family:inherit;font-size:.76rem;font-weight:600;letter-spacing:.02em;
    padding:8px 14px;border:0;background:transparent;color:var(--dim);cursor:pointer;
    transition:.15s;white-space:nowrap;
  }
  .toggle button.on{background:var(--a1);color:#fff}
  .rule{height:2px;background:linear-gradient(90deg,var(--a1),var(--a2) 38%,var(--a3) 70%,var(--a4));margin:0 0 24px;opacity:.85;border-radius:2px}

  input[type=text]{
    width:100%;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:1.4rem;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;
    padding:17px 19px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card-bg);
    color:var(--text);
    box-shadow:0 1px 2px rgba(32,34,63,.05);
  }
  input[type=text]:focus{outline:none;border-color:var(--a2);box-shadow:0 0 0 3px rgba(var(--focus),.16)}
  input::placeholder{color:#a9aac6;font-weight:400;letter-spacing:.05em}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.8rem;font-weight:600;letter-spacing:.06em;
    background:var(--card-bg);border:1px solid var(--line);
    border-left:3px solid var(--a1);
    border-radius:7px;padding:6px 8px 6px 11px;color:var(--text);
  }
  .chip button{
    border:0;background:transparent;cursor:pointer;padding:0 2px;
    color:var(--dim);font-size:1rem;line-height:1;font-family:inherit;
  }
  .chip button:hover{color:var(--a1)}
  .chips .clear{
    font-family:inherit;font-size:.72rem;letter-spacing:.02em;
    background:transparent;border:0;color:var(--dim);cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;align-self:center;
  }
  .chip .cg{
    border:0;background:transparent;cursor:pointer;padding:0;color:inherit;
    font-family:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;
  }
  .chip.hasreq{border-left-color:var(--a2)}
  .creq{
    font-size:.68rem;font-weight:500;letter-spacing:.03em;color:var(--a2);
    padding-left:1px;
  }
  .reqbar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin:11px 0 0;padding:11px 13px;
    background:var(--card-bg);border:1px solid var(--line);border-radius:9px;
  }
  .reqbar>label{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:#9a9cb4;
  }
  .reqbar .done{margin-left:auto;font-size:.72rem;color:var(--dim);
    background:transparent;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .grows{margin-top:9px}
  .grow{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding:5px 0;border-top:1px solid #f0f0f7;
  }
  .grow:first-child{border-top:0}
  body.heme .grow{border-top-color:#fbeef1}
  .gname{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.78rem;font-weight:700;letter-spacing:.06em;
    min-width:88px;
  }
  .gname.off{color:#b9bacd;font-weight:500}
  body.heme .gname.off{color:#d3b3bb}
  .grow .tags{margin-top:0}
  .nocov{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.67rem;letter-spacing:.05em;color:#b9bacd;
  }
  body.heme .nocov{color:#d3b3bb}
  .hint{font-size:.82rem;color:var(--dim);margin:11px 0 24px}

  .suggest{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:7px}
  .suggest button{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.78rem;letter-spacing:.06em;
    background:var(--card-bg);border:1px solid var(--line);
    border-radius:6px;padding:6px 11px;cursor:pointer;color:var(--text);
    transition:.15s;
  }
  .suggest button:hover{background:var(--a2);border-color:var(--a2);color:#fff}
  .alias{opacity:.55;font-weight:400}
  .suggest button:hover .alias{opacity:.85}

  .controls{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    flex-wrap:wrap;margin:0 0 13px;
  }
  .filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .filterbar>label,.sortbar label{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:#9a9cb4;
  }
  .fchip{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.67rem;letter-spacing:.06em;
    padding:4px 9px;border-radius:5px;border:1px solid var(--line);
    background:var(--card-bg);color:#9a9cb4;cursor:pointer;transition:.13s;
  }
  .fchip:hover{border-color:#b9bacd}
  .fchip.on.hot{color:#5a42ab;border-color:#c9bdf1;background:#f0ecfd}
  .fchip.on.exon{color:#1f5f9e;border-color:#b8d4f0;background:#eaf3fc}
  .fchip.on.tgt{color:#7a3f52;border-color:#e6c3cd;background:#fbeff2}
  .fchip.on.cnv{color:#8b3a98;border-color:#e5bfea;background:#faeffb}
  .fchip.on.fus{color:#1f7a70;border-color:#b3ddd7;background:#eaf7f5}
  .fchip.on.loh{color:#96650f;border-color:#e8cf9e;background:#fdf5e6}
  .sortbar{
    display:flex;align-items:center;gap:9px;margin-left:auto;
  }
  .sortbar label{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:#9a9cb4;
  }
  .sortbar select{
    font-family:inherit;font-size:.78rem;color:var(--text);
    background:var(--card-bg);border:1px solid var(--line);border-radius:7px;
    padding:5px 9px;cursor:pointer;
  }
  .sortbar select:focus{outline:none;border-color:var(--a2);box-shadow:0 0 0 3px rgba(var(--focus),.14)}
  .gene-title{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:1.75rem;font-weight:700;letter-spacing:.1em;
    margin:28px 0 3px;
  }
  .verdict{font-size:.88rem;color:var(--dim);margin:0 0 20px}

  .panel{
    position:relative;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-left:4px solid var(--line);
    border-radius:10px;
    padding:14px 17px;
    margin-bottom:11px;
    box-shadow:0 1px 2px rgba(32,34,63,.04);
  }
  .panel .bar{
    position:absolute;left:-4px;top:-1px;bottom:-1px;width:4px;
    border-radius:10px 0 0 10px;
  }
  .frac{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.63rem;letter-spacing:.09em;text-transform:uppercase;
    color:#9a9cb4;border:1px solid var(--line);border-radius:4px;
    padding:2px 6px;margin-left:9px;white-space:nowrap;font-weight:500;
  }
  body.heme .frac{color:#b0929a}
  .star{
    font-size:.85em;font-weight:700;margin-left:2px;
    color:#c2841f;line-height:0;
  }
  body.heme .star{color:#b0553a}
  .pname{
    font-size:.94rem;font-weight:600;margin:0;
    display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  }
  .pcode{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.66rem;letter-spacing:.11em;text-transform:uppercase;
    color:var(--dim);font-weight:400;white-space:nowrap;
  }
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .tag{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.67rem;letter-spacing:.06em;
    padding:4px 9px;border-radius:5px;border:1px solid;
  }
  .tag.tgt{color:#7a3f52;border-color:#e6c3cd;background:#fbeff2}
  .tag.has-tip{cursor:help;border-style:dashed}
  .tip{
    position:relative;display:inline-block;
  }
  .tipbox{
    display:none;position:absolute;z-index:20;left:0;top:calc(100% + 6px);
    background:var(--text);color:#fff;border-radius:6px;padding:7px 10px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.68rem;letter-spacing:.03em;line-height:1.5;
    white-space:normal;width:max-content;max-width:min(300px,70vw);
    box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .tip.open .tipbox,.tip:hover .tipbox{display:block}
  .tag.hot{color:#5a42ab;border-color:#c9bdf1;background:#f0ecfd}
  .tag.exon{color:#1f5f9e;border-color:#b8d4f0;background:#eaf3fc}
  .tag.cnv{color:#8b3a98;border-color:#e5bfea;background:#faeffb}
  .tag.fus{color:#1f7a70;border-color:#b3ddd7;background:#eaf7f5}
  .tag.loh{color:#96650f;border-color:#e8cf9e;background:#fdf5e6}
  body.heme .tag.hot{color:#9c2b4c;border-color:#f0c2ce;background:#fdeef2}
  body.heme .tag.exon{color:#8c3f52;border-color:#eec7d0;background:#fcf0f3}

  .absent{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-left:4px solid #c3c4d6;
    border-radius:10px;
    padding:14px 17px;
    margin-top:14px;
    box-shadow:0 1px 2px rgba(32,34,63,.04);
  }
  body.heme .absent{border-left-color:#dcc2c9}
  .absent b{
    display:block;margin-bottom:8px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.66rem;color:var(--dim);font-weight:600;
    text-transform:uppercase;letter-spacing:.11em;
  }
  .absent ul{list-style:none;margin:0;padding:0}
  .absent li{
    font-size:.9rem;color:#8a8ca8;line-height:1.75;font-weight:500;
  }
  body.heme .absent li{color:#a3808b}

  .note{
    margin-top:30px;padding-top:16px;border-top:1px solid var(--line);
    font-size:.79rem;color:var(--dim);
  }
  .note b{color:var(--text);font-weight:600}
  .note p{margin:0 0 7px}
  .empty{color:var(--dim);font-size:.9rem;margin-top:26px}
  footer{
    margin-top:22px;padding-top:13px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
    color:#9799b8;
  }
  @media (max-width:520px){
    input[type=text]{font-size:1.1rem}
    .gene-title{font-size:1.4rem}
    .pname{flex-direction:column;gap:3px}
    header{flex-direction:column}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>NGS Panel Lookup</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="toggle">
    <button id="btn-solid" class="on">Solid tumour</button>
    <button id="btn-heme">Haematology</button>
  </div>
</header>
<div class="rule"></div>

<input type="text" id="q" placeholder="Enter a gene..." autocomplete="off" spellcheck="false" autofocus>
<div class="chips" id="chips"></div>
<div id="reqbar"></div>
<p class="hint">Search by symbol (TP53, CDKN2A, IDH1). Press Enter to add a gene and compare several at once. Click a gene to require a specific analysis type for it.</p>

<div id="out"></div>

<div class="note" id="notes"></div>

<footer>
  <span>v1.9 &middot; Sep 2026 &middot; GC</span>
  <span>Panel content per manufacturer specifications</span>
</footer>

</div>

function prep(SET){
  const keys=Object.keys(SET);
  keys.forEach(function(k){
    ["spikein","expanded"].forEach(function(f){
      if(typeof SET[k][f]==="string"){
        SET[k][f]=new Set(SET[k][f].split(/[\s,]+/).filter(Boolean)
                   .map(function(g){return ALIAS[g]||g;}));
      }
    });
    if(SET[k].detail){
      Object.keys(SET[k].detail).forEach(function(f){
        SET[k][f]=((SET[k][f]||"")+" "+Object.keys(SET[k].detail[f]).join(" ")).trim();
      });
    }
    FIELDS.forEach(function(f){
      const raw=(typeof SET[k][f]==="string"?SET[k][f]:"").split(/[\s,]+/).filter(Boolean)
                 .map(function(g){return ALIAS[g]||g;});
      SET[k][f]=new Set(raw);
    });
  });
  if(SET.odp){SET.odp.cnv=SET.odp.exon;SET.odp.loh=SET.odp.exon;}
  const all=new Set();
  keys.forEach(function(k){
    const u=new Set();
    FIELDS.forEach(function(f){SET[k][f].forEach(function(g){u.add(g);all.add(g);});});
    SET[k].size=u.size;
  });
  const sug=[...all].map(function(g){return {label:g, gene:g};});
  Object.keys(ALIAS).forEach(function(a){
    if(all.has(ALIAS[a])) sug.push({label:a, gene:ALIAS[a], alias:true});
  });
  sug.sort(function(x,y){return x.label<y.label?-1:x.label>y.label?1:0;});
  return {keys:keys, all:all, sorted:[...all].sort(), sug:sug};
}

function fieldsIn(m){
  const SET=m==="solid"?SOLID:HEME;
  return FIELDS.filter(function(f){
    return Object.keys(SET).some(function(k){return SET[k][f].size>0;});
  });
}

function setMode(m){
  mode=m;
  document.body.classList.toggle("heme", m==="heme");
  document.getElementById("btn-solid").classList.toggle("on", m==="solid");
  document.getElementById("btn-heme").classList.toggle("on", m==="heme");
  const keys=IDX[m].keys;
  sub.textContent = keys.length
    ? keys.map(function(k){return DATA[m][k].code.split(" /")[0];}).join(" \u00b7 ")
    : "No panels loaded";
  notes.innerHTML=NOTES[m];
  const avail=fieldsIn(m);
  Object.keys(reqs).forEach(function(g){
    reqs[g]=reqs[g].filter(function(f){return avail.indexOf(f)>=0;});
    if(!reqs[g].length)delete reqs[g];
  });
  openReq=null;
  drawChips();
  refresh();
  q.focus();
}

function drawChips(){
  if(!picked.length){chips.innerHTML="";reqbar.innerHTML="";return;}
  chips.innerHTML = picked.map(function(g,i){
    const r=reqs[g]||[];
    return '<span class="chip'+(r.length?' hasreq':'')+'">'
      +'<button class="cg" data-g="'+g+'" title="Set required analysis type">'+g+'</button>'
      +(r.length?'<span class="creq">'+r.map(function(f){return LABEL[f][0];}).join(", ")+'</span>':'')
      +'<button class="cx" data-i="'+i+'" title="Remove">&times;</button></span>';
  }).join("") + (picked.length>1?'<button class="clear">Clear all</button>':'');

  chips.querySelectorAll(".cx").forEach(function(b){
    b.onclick=function(){
      const g=picked[+b.dataset.i];
      picked.splice(+b.dataset.i,1);
      delete reqs[g];
      if(openReq===g)openReq=null;
      drawChips();refresh();
    };
  });
  chips.querySelectorAll(".cg").forEach(function(b){
    b.onclick=function(){
      openReq = openReq===b.dataset.g ? null : b.dataset.g;
      drawReq();
    };
  });
  const c=chips.querySelector(".clear");
  if(c)c.onclick=function(){picked=[];reqs={};openReq=null;drawChips();refresh();};
  drawReq();
}

function drawReq(){
  if(!openReq || picked.indexOf(openReq)<0){reqbar.innerHTML="";return;}
  const g=openReq, r=reqs[g]||[];
  reqbar.innerHTML='<div class="reqbar"><label>Require for '+g+'</label>'
    + fieldsIn(mode).map(function(f){
        return '<button class="fchip '+LABEL[f][1]+(r.indexOf(f)>=0?" on":"")
             + '" data-f="'+f+'">'+LABEL[f][0]+'</button>';
      }).join("")
    + '<button class="done">Done</button></div>';
  reqbar.querySelectorAll(".fchip").forEach(function(b){
    b.onclick=function(){
      const f=b.dataset.f, cur=reqs[g]||[], i=cur.indexOf(f);
      if(i>=0)cur.splice(i,1); else cur.push(f);
      if(cur.length)reqs[g]=cur; else delete reqs[g];
      drawChips();refresh();
    };
  });
  const dn=reqbar.querySelector(".done");
  if(dn)dn.onclick=function(){openReq=null;drawReq();};
}

function addGene(g){
  if(picked.indexOf(g)<0)picked.push(g);
  q.value="";
  drawChips();
  refresh();
  q.focus();
}

function refresh(){
  const term=q.value.trim().toUpperCase();
  if(term){
    const g=ALIAS[term]||term;
    if(IDX[mode].all.has(g))renderMany(picked.concat(picked.indexOf(g)<0?[g]:[]));
    else suggest(term);
    return;
  }
  if(picked.length)renderMany(picked); else out.innerHTML="";
}

function tagHTML(panel,f,gene){
  const cls=LABEL[f][1], txt=LABEL[f][0];
  const d=panel.detail && panel.detail[f] && panel.detail[f][gene];
  if(d){
    return '<span class="tip"><span class="tag '+cls+' has-tip">'+txt+'</span>'
         + '<span class="tipbox">'+d+'</span></span>';
  }
  if(f==="hotspot"){
    if(panel.spikein && panel.spikein.has(gene))
      return '<span class="tip"><span class="tag '+cls+' has-tip">'+txt
           + '<sup class="star">*</sup></span>'
           + '<span class="tipbox">Only in the spike-in version</span></span>';
    if(panel.expanded && panel.expanded.has(gene))
      return '<span class="tip"><span class="tag '+cls+' has-tip">'+txt
           + '<sup class="star">*</sup></span>'
           + '<span class="tipbox">Expanded coverage in the spike-in version</span></span>';
  }
  return '<span class="tag '+cls+'">'+txt+'</span>';
}

function renderMany(genes){
  if(!genes.length){out.innerHTML="";return;}
  const SET=DATA[mode], keys=IDX[mode].keys, multi=genes.length>1;
  const present=[], absent=[];
  keys.forEach(function(k){
    const rows=genes.map(function(g){
      return {g:g, found:FIELDS.filter(function(f){return SET[k][f].has(g);})};
    });
    const meetsAll=genes.every(function(g,gi){
      const req=reqs[g];
      if(!req||!req.length)return true;
      return rows[gi].found.some(function(f){return req.indexOf(f)>=0;});
    });
    const ok = meetsAll && rows.some(function(r){return r.found.length;});
    (ok?present:absent).push({k:k, rows:rows});
  });

  present.forEach(function(p){
    p.n=p.rows.filter(function(r){return r.found.length;}).length;
    p.rows.sort(function(a,b){return (b.found.length?1:0)-(a.found.length?1:0);});
  });
  if(sortBy==="alpha"){
    present.sort(function(a,b){return SET[a.k].name<SET[b.k].name?-1:1;});
    absent.sort(function(a,b){return SET[a.k].name<SET[b.k].name?-1:1;});
  }else{
    present.sort(function(a,b){
      if(b.n!==a.n)return b.n-a.n;
      return SET[a.k].size-SET[b.k].size;
    });
    absent.sort(function(a,b){return SET[a.k].size-SET[b.k].size;});
  }

  let html='<p class="gene-title">'+genes.join('<span style="opacity:.35"> / </span>')+'</p>';
  html+='<p class="verdict">'+(present.length
      ? (multi?"Covered by ":"Covered by ")+present.length+" of "+keys.length+" panels."
        +(multi?" Not every panel covers every gene.":"")
      : (Object.keys(reqs).length
          ? "No panel meets the required analysis types."
          : "Not included in any of the "+keys.length+" panels."))+'</p>';

  html+='<div class="controls">';
  if(present.length>1){
    html+='<div class="sortbar"><label for="sortsel">Sort by</label>'
      +'<select id="sortsel">'
      +'<option value="recommended"'+(sortBy==="recommended"?" selected":"")+'>Recommended</option>'
      +'<option value="alpha"'+(sortBy==="alpha"?" selected":"")+'>Panel name</option>'
      +'</select></div>';
  }
  html+='</div>';

  present.forEach(function(p){
    const col="var(--"+ACCENT[keys.indexOf(p.k)%ACCENT.length]+")";
    const nCov=p.rows.filter(function(r){return r.found.length;}).length;
    const partial=multi && nCov<genes.length;
    const pct=Math.round(nCov/genes.length*100);
    const bar=partial
      ? '<i class="bar" style="background:linear-gradient(to bottom,'+col+' 0 '+pct+'%,#d2d3e0 '+pct+'% 100%)"></i>'
      : '<i class="bar" style="background:'+col+'"></i>';
    html+='<div class="panel" style="border-left-color:transparent">'+bar
      +'<p class="pname"><span>'+SET[p.k].name
      +(partial?'<span class="frac">'+nCov+' of '+genes.length+'</span>':'')
      +'</span><span class="pcode">'+SET[p.k].code+'</span></p>';
    if(multi){
      html+='<div class="grows">'+p.rows.map(function(r){
        return '<div class="grow"><span class="gname'+(r.found.length?'':' off')+'">'+r.g+'</span>'
          +(r.found.length
            ? '<span class="tags">'+r.found.map(function(f){return tagHTML(SET[p.k],f,r.g);}).join("")+'</span>'
            : '<span class="nocov">not covered</span>')
          +'</div>';
      }).join("")+'</div>';
    }else{
      html+='<div class="tags">'+p.rows[0].found.map(function(f){return tagHTML(SET[p.k],f,genes[0]);}).join("")+'</div>';
    }
    html+='</div>';
  });

  if(absent.length){
    html+='<div class="absent"><b>'+(Object.keys(reqs).length
        ? "Not meeting the requirements"
        : (multi?"Covers none of these genes":"Not included in"))+'</b><ul>'
      + absent.map(function(a){return '<li>'+SET[a.k].name+'</li>';}).join("") + '</ul></div>';
  }
  out.innerHTML=html;

  const sel=out.querySelector("#sortsel");
  if(sel)sel.onchange=function(){sortBy=sel.value;renderMany(genes);};



  out.querySelectorAll(".tag.has-tip").forEach(function(t){
    t.onclick=function(e){
      e.stopPropagation();
      const p=t.parentElement, was=p.classList.contains("open");
      out.querySelectorAll(".tip.open").forEach(function(o){o.classList.remove("open");});
      if(!was)p.classList.add("open");
    };
  });
}

document.addEventListener("click",function(){
  document.querySelectorAll(".tip.open").forEach(function(o){o.classList.remove("open");});
});

function suggest(term){
  const m=IDX[mode].sug.filter(function(s){return s.label.indexOf(term)===0;}).slice(0,16);
  if(!m.length){out.innerHTML='<p class="empty">No gene matches "'+term+'" in the '+(mode==="solid"?"solid tumour":"haematology")+' panels.</p>';return;}
  out.innerHTML='<ul class="suggest">'+m.map(function(s){
    return '<li><button data-g="'+s.gene+'">'+(s.alias
      ? s.label+' <span class="alias">\u2192 '+s.gene+'</span>'
      : s.label)+'</button></li>';
  }).join("")+'</ul>';
  out.querySelectorAll("button").forEach(function(b){b.onclick=function(){addGene(b.dataset.g);};});
}

q.addEventListener("input",refresh);
q.addEventListener("keydown",function(e){
  if(e.key==="Backspace" && !q.value && picked.length){
    picked.pop();drawChips();refresh();return;
  }
  if(e.key!=="Enter")return;
  const t=q.value.trim().toUpperCase();
  if(!t)return;
  const g=ALIAS[t]||t;
  const first=out.querySelector(".suggest button");
  if(IDX[mode].all.has(g))addGene(g);
  else if(first)addGene(first.dataset.g);
});

document.getElementById("btn-solid").onclick=function(){setMode("solid");};
document.getElementById("btn-heme").onclick=function(){setMode("heme");};

setMode("solid");
</script>
</body>
</html>
